<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Keyboard Blocker</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { width: 270px; margin: 0; padding: 16px; background: #111114; color: #f4f4f5; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    input[type="checkbox"] { appearance:none; -webkit-appearance:none; width:44px; height:24px; margin:0; border:1px solid #3c3c44; border-radius:999px; background:#202025; position:relative; cursor:pointer; transition:.16s ease; }
    input[type="checkbox"]::after { content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; border-radius:50%; background:#d8d8dd; box-shadow:0 1px 4px rgba(0,0,0,.45); transition:transform .16s ease, background .16s ease; }
    input[type="checkbox"]:checked { background:#ef4444; border-color:#ff5b5b; }
    input[type="checkbox"]:checked::after { transform:translateX(20px); background:#fff; }
    input[type="checkbox"]:focus-visible, button:focus-visible { outline:2px solid #ff5d5d; outline-offset:3px; }
    #mode { color:#9f9fa9; font-size:12px; margin:8px 0 14px; }
    button { width:100%; border:1px solid #39393f; border-radius:8px; padding:9px; cursor:pointer; background:#27272a; color:#fff; font-weight:600; transition:background .15s ease, transform .08s ease; }
    button:hover { background:#323238; }
    button:active { transform:translateY(1px); }
  </style>
</head>
<body>
  <h1 data-i18n="extName">YouTube Keyboard Blocker</h1>
  <label class="row">
    <span data-i18n="popupActive">Enabled</span>
    <input id="enabled" type="checkbox">
  </label>
  <div id="mode"></div>
  <button id="options" data-i18n="popupConfigure">Configure keys</button>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
